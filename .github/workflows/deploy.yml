name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 8

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy musicai-bot \
            --source infra/docker/Dockerfile.bot \
            --platform managed \
            --region ${{ secrets.GCP_REGION }} \
            --allow-unauthenticated

          gcloud run deploy musicai-api \
            --source infra/docker/Dockerfile.api \
            --platform managed \
            --region ${{ secrets.GCP_REGION }} \
            --allow-unauthenticated

          gcloud run deploy musicai-worker \
            --source infra/docker/Dockerfile.worker \
            --platform managed \
            --region ${{ secrets.GCP_REGION }} \
            --set-env-vars=DATABASE_URL=${{ secrets.DATABASE_URL }},REDIS_URL=${{ secrets.REDIS_URL }}
